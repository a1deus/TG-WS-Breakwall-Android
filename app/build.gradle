plugins {
    id 'com.android.application' version '8.9.2'
    id 'com.chaquo.python' version '17.2.0'
}

android {
    namespace 'io.localproxy.telegramws'
    compileSdk 35

    defaultConfig {
        applicationId 'io.localproxy.telegramws'
        minSdk 24
        targetSdk 35
        versionCode 5
        versionName '1.0.2'
        ndk {
            abiFilters 'arm64-v8a', 'x86_64'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildFeatures {
        buildConfig true
    }
}

chaquopy {
    defaultConfig {
        version '3.13'
        if (System.getenv('TGWS_BUILD_PYTHON')) {
            buildPython System.getenv('TGWS_BUILD_PYTHON')
        }
        pip {
            install 'certifi'
            install 'httpx[http2]==0.28.1'
            install 'cryptography==42.0.8'
        }
    }
}
